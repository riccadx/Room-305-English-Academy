<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1e293b" />
      <stop offset="100%" stopColor="#0f172a" />
    </linearGradient>
    <linearGradient id="owlBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#6366f1" />
      <stop offset="100%" stopColor="#4338ca" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fbbf24" />
      <stop offset="100%" stopColor="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background Squircle -->
  <rect width="160" height="160" rx="36" fill="url(#bgGrad)" stroke="#6366f1" stroke-width="4" />
  
  <!-- Subtle Back Glow -->
  <circle cx="80" cy="85" r="55" fill="#4f46e5" opacity="0.35" />

  <!-- Owl Ears -->
  <polygon points="42,50 55,22 68,44" fill="#4338ca" />
  <polygon points="118,50 105,22 92,44" fill="#4338ca" />

  <!-- Headphones Arc -->
  <path d="M 36 70 A 44 44 0 0 1 124 70" fill="none" stroke="#f43f5e" stroke-width="6" stroke-linecap="round" />
  <rect x="28" y="60" width="10" height="20" rx="5" fill="#f43f5e" stroke="#ffffff" stroke-width="1.5" />
  <rect x="122" y="60" width="10" height="20" rx="5" fill="#f43f5e" stroke="#ffffff" stroke-width="1.5" />

  <!-- Owl Body -->
  <ellipse cx="80" cy="95" rx="44" ry="46" fill="url(#owlBodyGrad)" stroke="#818cf8" stroke-width="2.5" />

  <!-- White Belly -->
  <ellipse cx="80" cy="102" rx="28" ry="30" fill="#ffffff" />
  <path d="M 72 90 Q 80 95 88 90 M 68 100 Q 80 106 92 100" stroke="#818cf8" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7" />

  <!-- Big Cute Eyes -->
  <circle cx="60" cy="72" r="18" fill="#ffffff" stroke="#c7d2fe" stroke-width="2" />
  <circle cx="100" cy="72" r="18" fill="#ffffff" stroke="#c7d2fe" stroke-width="2" />

  <!-- Pupils & Shine -->
  <circle cx="61" cy="72" r="8" fill="#0f172a" />
  <circle cx="63" cy="69" r="3" fill="#ffffff" />
  <circle cx="99" cy="72" r="8" fill="#0f172a" />
  <circle cx="101" cy="69" r="3" fill="#ffffff" />

  <!-- Golden Beak -->
  <polygon points="74,78 86,78 80,92" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1" />

  <!-- Graduation Cap -->
  <g transform="translate(0, 4)">
    <polygon points="80,14 116,26 80,38 44,26" fill="#1e1b4b" stroke="#fbbf24" stroke-width="2" />
    <rect x="70" y="26" width="20" height="10" rx="2" fill="#312e81" />
    <path d="M 80 26 L 110 33 L 112 46" stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <circle cx="112" cy="48" r="3" fill="#fbbf24" />
  </g>

  <!-- ABC Book held in wings -->
  <rect x="64" y="118" width="32" height="20" rx="3" fill="#10b981" stroke="#047857" stroke-width="1.5" />
  <line x1="80" y1="118" x2="80" y2="138" stroke="#ffffff" stroke-width="1.5" />
  <text x="70" y="132" fill="#ffffff" font-size="8" font-weight="bold" font-family="sans-serif">ABC</text>

  <!-- Sparkles -->
  <circle cx="28" cy="34" r="2.5" fill="#fbbf24" />
  <circle cx="132" cy="32" r="3" fill="#fbbf24" />
</svg>